# Build, verify, and deploy the static Korean Learning Tool.
name: Test and deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korean-learning-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log || {
            echo "::error::npm ci failed. See the dependency error below."
            grep '^npm error' install.log | head -8 | sed 's/^/::error::/' || true
            exit 1
          }
      - name: List spoken prompts
        run: node scripts/korean-prompts.mjs korean-prompts.json
      - name: Restore Korean voice clips
        id: korean-audio
        uses: actions/cache/restore@v4
        with:
          path: public/assets/ko-f1-*.mp3
          key: supertonic3-f1-v1-${{ hashFiles('korean-prompts.json', 'scripts/build-hangul-audio.py') }}
      - name: Render Korean voice clips
        if: steps.korean-audio.outputs.cache-hit != 'true'
        run: |
          model=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          curl -fLsS --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$model.tar.bz2" -o "$RUNNER_TEMP/model.tar.bz2"
          tar -xjf "$RUNNER_TEMP/model.tar.bz2" -C "$RUNNER_TEMP"
          python3 -m venv "$RUNNER_TEMP/tts-env"
          "$RUNNER_TEMP/tts-env/bin/pip" install sherpa-onnx soundfile numpy
          "$RUNNER_TEMP/tts-env/bin/python" scripts/build-hangul-audio.py "$RUNNER_TEMP/$model" korean-prompts.json
      - name: Save Korean voice clips
        if: steps.korean-audio.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/assets/ko-f1-*.mp3
          key: ${{ steps.korean-audio.outputs.cache-primary-key }}
      - run: npm run test
      - name: Build and test in Chrome
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test.log || {
            grep -E 'Error|expected|actual|waiting for|✖' browser-test.log | head -12 | sed 's/^/::error::/' || true
            exit 1
          }
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
